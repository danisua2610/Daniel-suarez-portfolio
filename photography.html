<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Photography portfolio by Daniel Suarez."
  >

  <title>
    Photography | Daniel Suarez
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <header class="site-header">

    <a
      href="index.html"
      class="logo"
    >
      DS
    </a>


    <nav aria-label="Main navigation">

      <a href="index.html#about">
        About
      </a>

      <a href="index.html#work">
        Work
      </a>

      <a href="index.html#contact">
        Contact
      </a>

    </nav>

  </header>



  <main class="section">


    <div class="section-heading">

      <p>
        VISUAL STORYTELLING
      </p>

      <h1>
        Photography
      </h1>

    </div>


    <div class="project-page-intro">

      <p>
        A selection of sports, event, portrait, travel
        and documentary photography. Click any image
        to view it larger.
      </p>

    </div>



    <div
      class="photo-gallery"
      id="photo-gallery"
    >

      <img
        src="images/gradFIU Large.jpeg"
        alt="FIU graduation event"
      >

      <img
        src="images/ingramB&W Large.jpeg"
        alt="Basketball photography"

      <img
        src="images/traeYoung2 Large.jpeg"

      >

      <img
        src="images/traeYoung Large.jpeg"
        alt="Trae Young game photography"
      >

      <img
        src="images/traeYoung4 Large.jpeg"
        alt="Trae Young sports photography"
      >

      <img
        src="images/traeYoung6 Large.jpeg"
        alt="Trae Young basketball action"
      >

      <img
        src="images/ingram1 Large.jpeg"
        alt="Basketball game photography"
      >

      <img
        src="images/hockey1 Large.jpeg"
        alt="Hockey photography"
      >

      <img
        src="images/hockey Large.jpeg"
        alt="Hockey action photography"
      >

      <img
        src="images/hockey4 Large.jpeg"
        alt="Hockey game photography"
      >

      <img
        src="images/lamelo Large.jpeg"
        alt="LaMelo Ball basketball photography"
      >

      <img
        src="images/lamelo1 Large.jpeg"

      <img
        src="images/lamelo2 Large.jpeg"

      <img

        src="images/messi1 Large.jpeg"

      >

      <img
        src="images/portrait Large.jpeg"
        alt="Portrait photography"
      >

      <img
        src="images/portrait1 Large.jpeg"
        alt="Portrait photography"
      >

      <img
        src="images/DCstudents Large.jpeg"
        alt="Student event photography in Washington DC"
      >

      <img
        src="images/DCstudents1 Large.jpeg"
        alt="Student event photography in Washington DC"
      >

      <img
        src="images/DC Large.jpeg"
        alt="Washington DC photography"
      >

      <img
        src="images/boston Large.jpeg"
        alt="Boston travel photography"
      >

      <img
        src="images/runner Large.jpeg"
        alt="Running photography"
      >

    </div>

  </main>



  <!-- LIGHTBOX -->

  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
  >

    <button
      class="lightbox-close"
      id="lightbox-close"
      aria-label="Close image"
    >
      ×
    </button>

    <img
      id="lightbox-image"
      src=""
      alt=""
    >

  </div>


  <script src="script.js"></script>


</body>
</html>
