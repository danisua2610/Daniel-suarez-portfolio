<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Resume of Daniel Suarez, multimedia producer, sports journalist, writer and content creator."
  >

  <title>Resume | Daniel Suarez</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- HEADER -->

  <header class="site-header">

    <a href="index.html" class="logo">DS</a>

    <nav aria-label="Main navigation">
      <a href="index.html#about">About</a>
      <a href="index.html#work">Work</a>
      <a href="index.html#contact">Contact</a>
    </nav>

  </header>


  <!-- RESUME -->

  <main class="section resume-page">

    <div class="resume-heading">

      <div class="section-heading">
        <p>EXPERIENCE & SKILLS</p>
        <h1>Resume</h1>
      </div>


      <div class="resume-actions">

        <a
          class="btn primary"
          href="resume.pdf"
          target="_blank"
          rel="noopener"
        >
          Open PDF ↗
        </a>

        <a
          class="btn"
          href="resume.pdf"
          download
        >
          Download Resume
        </a>

      </div>

    </div>


    <!-- EMBEDDED PDF -->

    <div class="resume-viewer">

      <iframe
        src="resume.pdf"
        title="Daniel Suarez Resume"
      ></iframe>

    </div>

  </main>


  <footer>

    <span>
      © <span id="year"></span> Daniel Suarez
    </span>

    <span>
      Multimedia • Sports • Storytelling
    </span>

  </footer>


  <script src="script.js"></script>

</body>

</html>
